# The `gpuitizen` Lima VM: desktop Linux for the GL ES path (design `d19-lima-desktop-path`).
# Create once:  limactl create --name gpuitizen scripts/lima/gpuitizen.yaml
# Run commands: scripts/lima-run.sh <command...>
minimumLimaVersion: 2.0.0
vmType: vz
cpus: 4
memory: 8GiB
disk: 40GiB
images:
  - location: "https://cloud-images.ubuntu.com/releases/noble/release-20260926/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
    digest: "sha256:1d6bffe64b848468ac97f821d369a4846d983de1800ccf6b5ec8853e85cefc55"
  - location: "https://cloud-images.ubuntu.com/releases/noble/release-20260926/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
    digest: "sha256:6a81c37564db9b1ee84e141922625e1d7c5b389b99bb3c572e0243607d5bb4d2"
mounts:
  # The home directory at the same path (read-only), so absolute paths in configs resolve.
  - location: "~"
  # The dXn projects (this repository and the gpui-fast release workspace), writable for
  # `artifacts-temp/`.
  - location: "~/work-private/projects/dXn"
    writable: true
containerd:
  system: false
  user: false
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends \
        build-essential clang lld pkg-config curl ca-certificates git \
        mesa-utils libgl1-mesa-dri libegl1 libegl-mesa0 libgles2 libgbm1 mesa-vulkan-drivers \
        xvfb xauth dbus-x11 at-spi2-core libatspi2.0-dev \
        libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev \
        libxcb1-dev libxcb-xkb-dev libxcursor-dev libxrandr-dev libxi-dev \
        libfontconfig1-dev libfreetype-dev libssl-dev libzstd-dev
  - mode: user
    script: |
      #!/bin/bash
      set -eux
      if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
      fi
