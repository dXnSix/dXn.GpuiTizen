[package]
name = "dxn_gpui_tizen"
description = "The Tizen platform for GPUI (gpui-fast)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["tizen", "gpui", "samsung", "tv", "gui"]
categories = ["gui", "os::linux-apis"]
include = ["src/**/*.rs", "tests/**/*.rs", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
# GPUI (gpui-fast) without default features: the platform-neutral modules implement its traits and
# are tested on the host. No desktop platform crate (`gpui-fast-platform`, `gpui-fast-linux`) is
# ever a dependency.
gpui.workspace = true
# Font family names from fontconfig's font files (the `fonts` module); fontdb already uses it.
ttf-parser = "0.25"

# AccessKit's AT-SPI adapter (the `a11y` module), on every Linux so the Lima VM can test it over
# D-Bus; the version gpui-fast 0.1.13's Linux platform uses. Its `zbus` is no desktop platform.
[target.'cfg(target_os = "linux")'.dependencies]
accesskit_unix = "0.22"
# The platform-owned EGL path (the `egl` module): EGL, GL ES and wayland-egl loaded at run time,
# wgpu on the context through its GL backend, gpui_wgpu's external-target renderer.
anyhow.workspace = true
futures = "0.3"
gpui_wgpu.workspace = true
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"
log = "0.4"

# Tizen-only: the renderer and the shell's bindings.
[target.'cfg(target_vendor = "tizen")'.dependencies]
anyhow.workspace = true
dxn_gpui_tizen_sys = { path = "../dxn_gpui_tizen_sys", version = "0.1.0" }
futures = "0.3"
libc = "0.2"
gpui_wgpu.workspace = true
log = "0.4"
raw-window-handle = "0.6"
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
async-task = "4.7"

# The AT-SPI integration test (`tests/a11y_atspi.rs`) talks D-Bus itself.
[target.'cfg(target_os = "linux")'.dev-dependencies]
serde = "1"
zbus = { version = "5.5", default-features = false, features = ["async-io", "blocking-api"] }
# The Weston integration test (`tests/egl_wayland.rs`) makes its own Wayland surface.
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }

[lints]
workspace = true
