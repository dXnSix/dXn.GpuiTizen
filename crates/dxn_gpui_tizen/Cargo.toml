[package]
name = "dxn_gpui_tizen"
description = "The Tizen platform for GPUI (gpui-fast)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# GPUI (gpui-fast) without default features: the platform-neutral modules implement its traits and
# are tested on the host. No desktop platform crate (`gpui-fast-platform`, `gpui-fast-linux`) is
# ever a dependency.
gpui.workspace = true

# Tizen-only: the renderer.
[target.'cfg(target_vendor = "tizen")'.dependencies]
gpui_wgpu.workspace = true

[dev-dependencies]
async-task = "4.7"

[lints]
workspace = true
