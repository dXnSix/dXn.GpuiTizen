[package]
name = "example_long_list"
description = "A long, D-pad navigable GPUI list for Tizen TVs and the desktop."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "example_long_list"
path = "src/main.rs"

[dependencies]
gpui.workspace = true

[target.'cfg(target_vendor = "tizen")'.dependencies]
dxn_gpui_tizen = { path = "../../crates/dxn_gpui_tizen" }

# The desktop binary only: never part of a Tizen build.
[target.'cfg(not(target_vendor = "tizen"))'.dependencies]
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.13", features = ["wayland", "x11"] }
log = "0.4"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
