[workspace]
resolver = "2"
members = [
    "crates/dxn_gpui_tizen_sys",
    "crates/dxn_gpui_tizen",
    "crates/dxn_gpui_tizen_diag",
    "examples/counter",
    "examples/long_list",
    "examples/video",
    "xtask",
]
default-members = [
    "crates/dxn_gpui_tizen_sys",
    "crates/dxn_gpui_tizen",
    "crates/dxn_gpui_tizen_diag",
    "examples/counter",
    "examples/long_list",
    "examples/video",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dXnSix/dXn.GpuiTizen"
# Only dxn_gpui_tizen_sys and dxn_gpui_tizen are published (they say so); the diagnostic app, the
# examples and xtask never are.
publish = false

[workspace.dependencies]
# GPUI is gpui-fast, imported under GPUI's library names and pinned exactly to the version
# `nsh-platform-gpui` uses. Renderer changes reach builds only through `[patch.crates-io]` over all
# nine `gpui-fast-*` crates (never a local path in this committed manifest).
gpui = { package = "gpui-fast", version = "=0.1.13", default-features = false }
gpui_wgpu = { package = "gpui-fast-wgpu", version = "=0.1.13" }

anyhow = "1"
serde_json = "1"
toml = "0.8"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_vendor, values("tizen"))'] }
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"

# TV libraries: one exported entry symbol, no unwinding, everything inlined across crates.
[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.dev]
panic = "abort"

# The renderer changes TV builds need (gpui-fast changes 1-3 and 5, the video hole, the EGL 1.4
# and program-binary fixes of wgpu) until gpui-fast and wgpu release them: all nine `gpui-fast-*`
# crates from the gpui-fast fork's `tizen-release` (generated from `tizen` by `cargo xtask
# gpui-fast-release`) and the wgpu stack from the wgpu fork's `v30-tizen`, always together.
# `cargo xtask gpui-fast-release --verify` writes a local path config that overrides these with
# local checkouts while the forks change. Dropped once both release (docs/releasing.md).
[patch.crates-io]
gpui-fast-macros = { git = "https://github.com/dXnSix/gpui-fast", branch = "tizen-release" }
gpui-fast = { git = "https://github.com/dXnSix/gpui-fast", branch = "tizen-release" }
gpui-fast-apple = { git = "https://github.com/dXnSix/gpui-fast", branch = "tizen-release" }
gpui-fast-wgpu = { git = "https://github.com/dXnSix/gpui-fast", branch = "tizen-release" }
gpui-fast-macos = { git = "https://github.com/dXnSix/gpui-fast", branch = "tizen-release" }
gpui-fast-linux = { git = "https://github.com/dXnSix/gpui-fast", branch = "tizen-release" }
gpui-fast-windows = { git = "https://github.com/dXnSix/gpui-fast", branch = "tizen-release" }
gpui-fast-web = { git = "https://github.com/dXnSix/gpui-fast", branch = "tizen-release" }
gpui-fast-platform = { git = "https://github.com/dXnSix/gpui-fast", branch = "tizen-release" }
wgpu-hal = { git = "https://github.com/dXnSix/wgpu", branch = "v30-tizen" }
naga = { git = "https://github.com/dXnSix/wgpu", branch = "v30-tizen" }
naga-types = { git = "https://github.com/dXnSix/wgpu", branch = "v30-tizen" }
wgpu-types = { git = "https://github.com/dXnSix/wgpu", branch = "v30-tizen" }
wgpu-naga-bridge = { git = "https://github.com/dXnSix/wgpu", branch = "v30-tizen" }
wgpu-core = { git = "https://github.com/dXnSix/wgpu", branch = "v30-tizen" }
wgpu-core-deps-apple = { git = "https://github.com/dXnSix/wgpu", branch = "v30-tizen" }
wgpu-core-deps-emscripten = { git = "https://github.com/dXnSix/wgpu", branch = "v30-tizen" }
wgpu-core-deps-wasm = { git = "https://github.com/dXnSix/wgpu", branch = "v30-tizen" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/dXnSix/wgpu", branch = "v30-tizen" }
wgpu = { git = "https://github.com/dXnSix/wgpu", branch = "v30-tizen" }
