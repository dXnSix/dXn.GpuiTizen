name: Tizen SDK
description: >-
  Installs the Tizen SDK CLI (the Baseline SDK, never Tizen Studio) into ~/tizen-studio with the
  given packages, as docs/setup.md does, cached by the package list. The installer and the package
  manager accept Samsung's SDK licence on the runner (`--accept-license`): running this workflow is
  the repository owner's acceptance. Adds sdb, tz and the emulator CLI to PATH.
inputs:
  packages:
    description: >-
      Space-separated SDK packages, for example `TIZEN-8.0-NativeAppDevelopment-CLI`. The TV
      emulator's are `Emulator` (the emulator manager) and `TV-SAMSUNG-Public-Emulator` (TV Extension
      10.0), as `package-manager-cli.bin show-pkgs --tree` lists them in the default repository
      (2026-11-10).
    required: true
  sdk-version:
    description: The CLI installer's SDK version (docs/setup.md, step 2).
    default: '10.0'
runs:
  using: composite
  steps:
    - name: Cache
      id: cache
      uses: actions/cache@v4
      with:
        # The SDK only: ~/tizen-studio-data holds emulator VMs and signing profiles, never cached.
        path: ~/tizen-studio
        # `recipe`: bump it when the install steps below change (hashFiles cannot see this action
        # when another repository checks it out, as NSH's fork CI does).
        key: tizen-sdk-${{ runner.os }}-${{ inputs.sdk-version }}-recipe3-${{ inputs.packages }}

    - name: Install
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SDK_VERSION: ${{ inputs.sdk-version }}
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/tizen-sdk-installer"
        mkdir -p "$dir"
        curl -fsSL -o "$dir/tizen-sdk-cli.bin" \
          "https://usa.sdk-dl.tizen.org/web-cli_Tizen_SDK_${SDK_VERSION}_usa_ubuntu-64.bin"
        chmod +x "$dir/tizen-sdk-cli.bin"
        # Answers from a process substitution, not `yes |`: with pipefail, `yes` dies of SIGPIPE
        # once the installer exits and fails the step.
        "$dir/tizen-sdk-cli.bin" --accept-license "$HOME/tizen-studio" < <(yes)
        # The installer's repository URL is http://, which the mirror answers with 403 (setup.md step 4).
        sed -i 's#^Repository: http://#Repository: https://#' "$HOME/tizen-studio/.info/repository.info"
        # The package manager checks each package's OS prerequisites with `dpkg -l <name> | grep ^ii`
        # and stops on a missing one. The native packages list python3.8 and libpython3.8, which
        # Ubuntu 24.04 does not have and no build here runs, so empty stand-in packages satisfy the
        # check (setup.md, "Troubleshooting").
        for name in python3.8 libpython3.8; do
          if ! dpkg -l "$name" 2>/dev/null | grep -q '^ii'; then
            pkg="$dir/stand-in/$name"
            mkdir -p "$pkg/DEBIAN"
            printf '%s\n' "Package: $name" 'Version: 3.8.0-0standin' 'Architecture: all' \
              'Maintainer: dXn.GpuiTizen CI <ci@invalid>' \
              'Description: empty stand-in for the Tizen SDK package manager prerequisite check' \
              >"$pkg/DEBIAN/control"
            dpkg-deb --build "$pkg" "$pkg.deb" >/dev/null
            sudo dpkg -i "$pkg.deb"
          fi
        done
        # shellcheck disable=SC2086
        "$HOME/tizen-studio/package-manager/package-manager-cli.bin" install --accept-license $PACKAGES

    # The package manager installs the emulator's system libraries (SDL 1.2 among them) outside
    # ~/tizen-studio, so a cache hit has the emulator without them: it then fails to start with
    # `libSDL-1.2.so.0: cannot open shared object file`. Whatever `ldd` finds missing is installed
    # from the Ubuntu package that ships it.
    - name: The emulator's system libraries
      if: contains(inputs.packages, 'Emulator')
      shell: bash
      run: |
        set -euo pipefail
        missing=$(find "$HOME/tizen-studio/platforms" -path '*/emulator/bin/emulator-x86_64' -print0 |
          xargs -0 -r ldd | awk '/not found/ {print $1}' | sort -u)
        if [ -z "$missing" ]; then
          echo "the emulator has every library it links"
          exit 0
        fi
        echo "missing: $missing"
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends apt-file >/dev/null
        sudo apt-file update >/dev/null
        packages=$(for so in $missing; do apt-file search -l "/$so" | head -1; done | sort -u)
        echo "installing: $packages"
        # shellcheck disable=SC2086
        sudo apt-get install -y --no-install-recommends $packages
        still=$(find "$HOME/tizen-studio/platforms" -path '*/emulator/bin/emulator-x86_64' -print0 |
          xargs -0 -r ldd | awk '/not found/ {print $1}' | sort -u)
        if [ -n "$still" ]; then
          echo "::error::the emulator still lacks: $still"
          exit 1
        fi

    - name: PATH
      shell: bash
      run: |
        echo "$HOME/tizen-studio/tools" >>"$GITHUB_PATH"
        echo "$HOME/tizen-studio/tools/tizen-core" >>"$GITHUB_PATH"
        echo "$HOME/tizen-studio/tools/emulator/bin" >>"$GITHUB_PATH"
        echo "$HOME/tizen-studio/tools/ide/bin" >>"$GITHUB_PATH"
