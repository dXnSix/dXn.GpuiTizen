name: Tizen emulator

# Installs, launches and reads the diagnostic app on the Samsung TV emulator (x86_64) on a
# GitHub-hosted Ubuntu runner with KVM. Manual and weekly. Whether the emulator boots on a hosted
# runner is the first thing this proves (docs/verification/tizen-devices.md records the runs).
#
# Signing needs no secrets: the emulator accepts a Tizen certificate, so the job creates a throwaway
# author certificate with `tz cert` and signs with the SDK's public Tizen distributor certificate.
# A Samsung TV needs a Samsung certificate instead, which stays on the owner's machine
# (docs/development_setup.md).
on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

concurrency:
  group: tizen-emulator
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  EMULATOR: dxn-tv
  PROFILE: ci
  APP_ID: DxnGpuiTzD.Diag

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        # The SDK, the TV emulator platform and its VM image do not fit next to the runner image's
        # preinstalled toolchains (the first run stopped with "No space left on device"). None of
        # those removed here is used by this job; .NET stays for the C# host.
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /usr/local/julia*
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: KVM and Xvfb
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb x11-utils mesa-utils libgl1-mesa-dri libglx-mesa0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: ./.github/actions/setup
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: ./.github/actions/tizen-sdk
        with:
          packages: TIZEN-8.0-NativeAppDevelopment-CLI Emulator TV-SAMSUNG-Public-Emulator

      - name: Signing profile (a throwaway Tizen certificate)
        run: |
          set -euo pipefail
          # `tz security-profiles add` keeps the certificates' passwords in the OS keyring; a hosted
          # runner has none, so start a session bus and an unlocked gnome-keyring for this job.
          sudo apt-get install -y --no-install-recommends gnome-keyring libsecret-tools dbus-x11
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >>"$GITHUB_ENV"
          keyring="$(printf '%s' ci | gnome-keyring-daemon --unlock --components=secrets)"
          eval "$keyring"
          echo "$keyring" | grep -E '^[A-Z_]+=' >>"$GITHUB_ENV" || true
          certs="$RUNNER_TEMP/tizen-certs"
          mkdir -p "$certs"
          chmod 700 "$certs"
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          tz cert -n dXn.GpuiTizen-CI -p "$password" -f "$certs/author"
          # The SDK's public distributor certificate; its password is the SDK's published one.
          tz security-profiles add -n "$PROFILE" -A \
            -a "$certs/author.p12" -p "$password" \
            -d "$HOME/tizen-studio/tools/certificate-generator/certificates/distributor/sdk-public/tizen-distributor-signer.p12" \
            -P tizenpkcs12passfordsigner
          tz security-profiles list

      - name: Package the x86_64 diagnostic TPK
        run: cargo xtask package --app diag --target x86_64 --sign "$PROFILE"

      - name: Boot the TV emulator headless
        timeout-minutes: 20
        run: |
          set -euo pipefail
          em-cli list-platform | tee "$RUNNER_TEMP/platforms.txt"
          platform="$(grep -io 'tv-samsung[^ ]*' "$RUNNER_TEMP/platforms.txt" | head -1)"
          [ -n "$platform" ] || { echo "::error::no TV emulator platform installed"; exit 1; }
          mkdir -p artifacts-temp/emulator
          # Xvfb of its own, for the job's whole life (not tied to em-cli's process), started before
          # `em-cli create`: create checks for OpenGL and, finding no display, configures VIGS's software
          # backend, under which the TV tuner device finds no `vigs_wsi` and the VM exits at once (run
          # 42907330624). With GLX on Xvfb, Mesa's llvmpipe provides the GL it checks for.
          Xvfb :99 -screen 0 1920x1080x24 +extension GLX >artifacts-temp/emulator/xvfb.log 2>&1 &
          export DISPLAY=:99
          echo "DISPLAY=:99" >>"$GITHUB_ENV"
          timeout 30 bash -c 'until xdpyinfo >/dev/null 2>&1; do sleep 1; done'
          glxinfo -B | tee artifacts-temp/emulator/glxinfo.txt || true
          em-cli create --help || true
          em-cli create -n "$EMULATOR" -p "$platform"
          conf=~/tizen-studio-data/emulator/vms/"$EMULATOR"/vm_launch.conf
          echo "::group::$conf"; cat "$conf" || true; echo "::endgroup::"
          nohup em-cli launch -n "$EMULATOR" >artifacts-temp/emulator/launch.log 2>&1 &
          # Listed by sdb first, ready for packages a little later. The TV emulator's `sdb shell` does not
          # run plain commands (run 42911347984: listed as `device`, `echo ready` never answered), so
          # readiness is `sdb capability` answering with the CPU architecture, as on a TV.
          if ! timeout 900 bash -c 'until sdb devices | grep -q "emulator-.*device" && timeout 20 sdb capability 2>/dev/null | grep -q cpu_arch; do sleep 10; done'; then
            echo "::error::the emulator did not come up in 15 minutes"
            # Printed here: a job stopped by its time limit keeps no logs.
            timeout 20 sdb devices || true
            timeout 20 sdb capability || true
            em-cli list-vm || true
            em-cli launch --help || true
            ps aux | grep -iE 'emulator|qemu' | grep -v grep || true
            for log in artifacts-temp/emulator/launch.log artifacts-temp/emulator/xvfb.log \
                       ~/tizen-studio-data/emulator/vms/"$EMULATOR"/logs/*; do
              [ -f "$log" ] || continue
              echo "::group::$log"; tail -n 200 "$log"; echo "::endgroup::"
            done
            exit 1
          fi
          sleep 30
          sdb devices
          sdb capability | tee artifacts-temp/emulator/capability.txt
          # What the two shell forms answer here (TVs take `sdb shell 0 <command>` only).
          echo "sdb shell echo: $(timeout 20 sdb shell echo ready 2>&1 | tr -d '\r' | head -3)"
          echo "sdb shell 0: $(timeout 20 sdb shell 0 getduid 2>&1 | tr -d '\r' | head -3)"

      - name: Install and launch
        run: |
          set -euo pipefail
          tpk="$(find target/tpk -maxdepth 1 -name '*-x86_64.tpk' -newer Cargo.toml | head -1)"
          [ -n "$tpk" ] || { echo "::error::no signed TPK under target/tpk"; exit 1; }
          serial="$(sdb devices | awk '/^emulator-/ {print $1; exit}')"
          pkg="${APP_ID%%.*}"
          # The TV emulator has no pkgcmd (`appcmd_support:disabled`): `sdb install` hands a .tpk to
          # the web-app installer, which rejects it while sdb still exits 0 (run 42915085901). TVs
          # install with `sdb shell 0 vd_appinstall`, which `tz install` uses; `vd_applist` confirms.
          installed() { timeout 60 sdb -s "$serial" shell 0 vd_applist 2>/dev/null | tr -d '\r' | grep -q "$pkg"; }
          for attempt in 1 2 3; do
            timeout 300 tz install -p "$tpk" -e "$serial" || true
            if ! installed; then
              remote="/home/owner/share/tmp/sdk_tools/$(basename "$tpk")"
              timeout 120 sdb -s "$serial" push "$tpk" "$remote" || true
              timeout 300 sdb -s "$serial" shell 0 vd_appinstall "$pkg" "$remote" 2>&1 | tr -d '\r' || true
            fi
            installed && break
            [ "$attempt" = 3 ] && { echo "::error::$pkg is not installed (vd_applist)"; exit 1; }
            echo "install attempt $attempt failed; retrying"; sleep 30
          done
          echo "$pkg installed"
          timeout 60 sdb -s "$serial" shell 0 execute "$APP_ID" 2>&1 | tr -d '\r'

      - name: Pull the diagnostic report
        run: |
          for attempt in 1 2 3 4 5 6; do
            if cargo xtask diag pull; then exit 0; fi
            echo "attempt $attempt failed; waiting for the app"
            sleep 20
          done
          exit 1

      - name: Emulator log
        if: always()
        timeout-minutes: 5
        run: |
          mkdir -p artifacts-temp/emulator
          cp -r ~/tizen-studio-data/emulator/vms/"$EMULATOR"/logs artifacts-temp/emulator/ 2>/dev/null || true
          # `sdb dlog` waits for a device forever when there is none.
          timeout 60 sdb dlog -d >artifacts-temp/emulator/dlog.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tizen-emulator
          path: |
            artifacts-temp/diag/
            artifacts-temp/emulator/
          if-no-files-found: warn

      - name: Remove the signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/tizen-certs" ~/tizen-studio-data/profile/profiles.xml
